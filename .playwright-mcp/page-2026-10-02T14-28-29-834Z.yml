    - generic [ref=f7e24]:
      - heading "Event Rules" [level=1] [ref=f7e25]
      - paragraph [ref=f7e26]: Failure to comply with the rules may result in disqualification. The host has final say on all outcomes.
      - generic [ref=f7e27]:
        - generic [ref=f7e28]:
          - heading "1. Deadlines" [level=2] [ref=f7e29]
          - generic [ref=f7e30]:
            - paragraph [ref=f7e31]: Deadlines for tournament registration or submitting work for each round are displayed on the main page. Participants who fail to submit their work by the deadline will be disqualified from the tournament. Exceptions may be made if we are notified of a delay in submission.
            - paragraph [ref=f7e32]: If a participant fails to submit their work for a round and does not notify the judges in any way, they are considered disqualified from the tournament and will never ever be allowed to participate in any future events.
        - generic [ref=f7e33]:
          - heading "2. How Challenges Work" [level=2] [ref=f7e34]
          - generic [ref=f7e35]:
            - paragraph [ref=f7e36]: Each match involves two players who are randomly paired by the host. The host assigns either a Truth or Dare challenge to each player. Challenges are selected randomly from the approved pool.
            - paragraph [ref=f7e37]: Players must complete their challenge in full to advance. The audience and host vote on the outcome. The player with the lower score is eliminated.
        - generic [ref=f7e38]:
          - heading "3. Fair Play & Conduct" [level=2] [ref=f7e39]
          - paragraph [ref=f7e41]: All participants must behave respectfully towards other players, spectators, and the host. Toxic behaviour, harassment, or cheating of any kind will result in immediate disqualification.
        - generic [ref=f7e42]:
          - heading "4. Tournament Progression" [level=2] [ref=f7e43]
          - generic [ref=f7e44]:
            - paragraph [ref=f7e45]: "The tournament consists of 4 rounds: Round of 16, Quarterfinals, Semifinals, and The Final. One player is eliminated per match. The bracket advances automatically after each round."
            - paragraph [ref=f7e46]: A player who refuses to complete a challenge without a valid reason is automatically eliminated. The host may choose to substitute a challenge if it is deemed unfit.
        - generic [ref=f7e47]:
          - heading "5. Prizes & Winner" [level=2] [ref=f7e48]
          - list [ref=f7e49]:
            - listitem [ref=f7e50]: • The last player standing wins the full £50 prize pool
            - listitem [ref=f7e51]: • Entry fee (£0.50) is collected in person by the host at check-in
            - listitem [ref=f7e52]: • No refunds once the event has started
            - listitem [ref=f7e53]: • The host has final say in all disputes
