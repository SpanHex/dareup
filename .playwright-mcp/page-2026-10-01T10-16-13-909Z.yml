        - heading "EVENT RULES" [level=1] [ref=f4e55]
        - paragraph [ref=f4e56]: Please read these guidelines carefully before competing. Failure to comply may result in immediate elimination.
      - generic [ref=f4e57]:
        - generic [ref=f4e58]:
          - heading "1. Deadlines & Check-In" [level=2] [ref=f4e64]
          - generic [ref=f4e65]:
            - paragraph [ref=f4e66]: Tournament check-in begins 30 minutes before the scheduled start time. Participants who fail to check in by the deadline will be disqualified and replaced by alternates.
            - paragraph [ref=f4e67]: If a participant fails to show up for their match and does not notify the hosts in advance, they forfeit their spot immediately and will be excluded from future tournaments.
        - generic [ref=f4e68]:
          - heading "2. How Challenges Work" [level=2] [ref=f4e73]
          - generic [ref=f4e74]:
            - paragraph [ref=f4e75]: Each match features two competitors paired in the tournament bracket. The host randomly assigns either a Truth question or a Dare challenge from the approved event vault.
            - paragraph [ref=f4e76]: Players must complete their challenge in full to remain eligible for victory. Both the audience and the jury score the attempt. The player with the lower aggregate score is eliminated.
        - generic [ref=f4e77]:
          - heading "3. Fair Play & Conduct" [level=2] [ref=f4e82]
          - generic [ref=f4e83]:
            - paragraph [ref=f4e84]: All participants must treat other players, spectators, and tournament officials with respect. Toxic harassment, bad-faith stalling, or malicious conduct results in immediate disqualification.
            - paragraph [ref=f4e85]: Challenges must be performed authentically without pre-recorded stand-ins or automated filters.
        - generic [ref=f4e86]:
          - heading "4. Tournament Progression" [level=2] [ref=f4e94]
          - generic [ref=f4e95]:
            - paragraph [ref=f4e96]: "The tournament consists of 4 single-elimination rounds: Round of 16 (16 players), Quarterfinals (8 players), Semifinals (4 players), and The Final (2 players)."
            - paragraph [ref=f4e97]: Refusing a dare without an approved safety objection incurs an immediate forfeit. The host reserves the right to issue a single substitution if an external issue prevents completion.
        - generic [ref=f4e98]:
          - heading "5. Prizes & Winner Take All" [level=2] [ref=f4e107]
          - generic [ref=f4e108]:
            - paragraph [ref=f4e109]: The champion who wins the Final round takes the entire £50 prize pool.
            - paragraph [ref=f4e110]: Entry fee of £0.50 is collected in person at check-in. Entry fees are non-refundable once the tournament bracket is generated.
            - paragraph [ref=f4e111]: The host and designated jury hold final authority over scoring disputes and rule clarifications.
